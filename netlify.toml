# CERCA.cl - despliegue de Angular 19 desde /frontend
[build]
  base = "frontend"
  command = "npm run build"
  publish = "dist/cerca/browser"

# Las rutas SEO (/comuna/rubro/negocio), sitemap, robots y /api se envían al backend desde
# frontend/public/_redirects (esas reglas se evalúan primero). Esta regla solo sirve la portada Angular.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
