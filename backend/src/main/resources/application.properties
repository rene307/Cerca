spring.application.name=cerca
server.port=8080
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/cerca}
spring.datasource.username=${DB_USER:cerca}
spring.datasource.password=${DB_PASSWORD:cerca_dev}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.flyway.enabled=true
server.error.include-message=always
